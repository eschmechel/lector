# lector keybinds — sourced from userprefs.conf (installed by install.sh)
# bindd form so entries appear in HyDE's Super+/ keybind hint (it reads `hyprctl binds -j`).
# P3 will add: Super+H dictation toggle (takes over the old voxd bind) and
# Super+Alt+H ask-the-doc, replacing Super+F stt-medium-toggle in keybindings.conf.

$ld = [Lector]

# floating window for the fzf menu / file picker (Hyprland v0.53+ rule syntax)
windowrule = float true, match:class ^(lector-menu)$
windowrule = size 700 450, match:class ^(lector-menu)$
windowrule = center true, match:class ^(lector-menu)$

bindd = Super, R, $ld read highlighted or clipboard aloud, exec, lectorctl read
bindd = Super Alt, R, $ld summarize then read aloud, exec, lectorctl summarize
bindd = Super Alt, A, $ld annotate to notes dir, exec, lectorctl annotate
bindd = Super, M, $ld menu, exec, lectorctl menu
bindd = Super, Space, $ld pause/resume, exec, lectorctl pause
bindd = Super Alt, Space, $ld stop, exec, lectorctl stop
bindd = Super, N, $ld next section, exec, lectorctl next
bindd = Super Alt, K, $ld keep last audio, exec, lectorctl keep
