# lector keybinds — sourced from userprefs.conf (installed by install.sh)
# bindd form so entries appear in HyDE's Super+/ keybind hint (it reads `hyprctl binds -j`).
#
# Hold-to-talk uses a press bind plus a `bindr` release bind on the same chord. The
# release is left undescribed on purpose: the hint viewer already lists the chord from
# the press bind, and combining flag letters (bindd + bindr) is needlessly fragile.

$ld = [Lector]

# floating window for the fzf menu / file picker (Hyprland v0.53+ rule syntax)
windowrule = float true, match:class ^(lector-menu)$
windowrule = size 700 450, match:class ^(lector-menu)$
windowrule = center true, match:class ^(lector-menu)$

# Reclaim the chords lector replaces (D28). Done with unbind rather than by editing
# HyDE's keybindings.conf, so a HyDE regeneration cannot resurrect them.
unbind = SUPER, F
unbind = SUPER, H

# --- voice in (P3) ---
# NB: bindd fields are comma-separated — descriptions must not contain commas.
bindd = Super, H, $ld dictate — hold to talk / double-tap to latch, exec, lectorctl dictate --start
bindr = Super, H, exec, lectorctl dictate --stop
bindd = Super Shift, H, $ld scribe — rewrite selection or write from intent, exec, lectorctl scribe --start
bindr = Super Shift, H, exec, lectorctl scribe --stop
bindd = Super Alt, C, $ld correct last insertion, exec, lectorctl correct

# --- read aloud (P1/P2) ---
bindd = Super, R, $ld read highlighted or clipboard aloud, exec, lectorctl read
bindd = Super Alt, R, $ld summarize then read aloud, exec, lectorctl summarize
bindd = Super Alt, A, $ld annotate to notes dir, exec, lectorctl annotate
bindd = Super, M, $ld menu, exec, lectorctl menu
bindd = Super, Space, $ld pause/resume, exec, lectorctl pause
bindd = Super Alt, Space, $ld stop, exec, lectorctl stop
bindd = Super, N, $ld next section, exec, lectorctl next
bindd = Super Alt, K, $ld keep last audio or promote dictation, exec, lectorctl keep
