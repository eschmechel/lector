[project]
name = "lector"
version = "0.1.0"
description = "Local read-aloud / annotate / voice-Q&A daemon for Hyprland (NotebookLM-at-home, one laptop)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "watchdog>=4.0",
    "httpx>=0.27",
]

[project.scripts]
lectord = "lector.daemon:main"
lectorctl = "lector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lector"]
